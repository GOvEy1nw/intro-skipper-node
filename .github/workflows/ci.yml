name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: dotnet restore Standalone/SegmentScanner.sln --locked-mode -p:StandaloneBuild=true
      - run: dotnet build Standalone/SegmentScanner.sln -c Release --no-restore -p:StandaloneBuild=true -p:SkipWebBuild=true
      - run: dotnet build Standalone/src/SegmentScanner.Desktop/SegmentScanner.Desktop.csproj -c Release -p:RestoreLockedMode=true -p:StandaloneBuild=true -p:SkipWebBuild=true
      - run: dotnet test Standalone/tests/SegmentScanner.Tests/SegmentScanner.Tests.csproj -c Release --no-restore -p:StandaloneBuild=true -p:SkipWebBuild=true
      - run: python -m unittest Standalone/scripts/tests/test_export_plex_markers.py
