<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IntroSkipper-Node settings</title>
<style nonce="__NONCE__">:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151e;color:#e8edf5}*{box-sizing:border-box}body{margin:0}main{width:min(720px,100%);margin:0 auto;padding:36px 24px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}h1{margin:0 0 5px;font-size:28px}h2{margin:0 0 18px;font-size:19px}p{line-height:1.5;margin:8px 0 16px}.hint,.subtitle{color:#a9b6ca;font-size:14px}.panel{border:1px solid #2d3a4d;border-radius:12px;background:#192231;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px}input:not([type=checkbox]){width:100%;background:#101824;color:inherit;border:1px solid #41516a;border-radius:6px;padding:11px 12px;margin:7px 0 15px;font:inherit}input:focus,button:focus-visible{outline:2px solid #89c3ff;outline-offset:2px}input[type=checkbox]{width:17px;height:17px;accent-color:#81b9fa}.check{display:flex;align-items:center;gap:10px;padding:9px 0}button{border:1px solid #465977;background:#283951;color:inherit;border-radius:6px;padding:10px 16px;font:inherit;cursor:pointer}button.primary{background:#8ac2ff;color:#0c1a2c;border-color:#8ac2ff;font-weight:600}button:disabled,input:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.badge{background:#263b56;border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:14px}#message{min-height:24px;margin:12px 0 0}#message.error{color:#ffb7ad}@media(max-width:620px){main{padding:22px 16px}header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.panel{padding:18px}}</style>
</head><body><main>
<header><div><h1>IntroSkipper-Node</h1><div class="subtitle">Connect this scanner to Jellyfin.</div></div><span class="badge" id="workerStatus">Stopped</span></header>
<section class="panel" aria-labelledby="connectionTitle"><h2 id="connectionTitle">Connection</h2><form id="connection"><label>Node name<input id="nodeName" required maxlength="200" placeholder="Media PC"></label><div class="grid"><label>Server address<input id="serverUrl" type="url" placeholder="http://192.168.1.115:8097" required></label><label>Jellyfin API key<input id="apiKey" type="password" autocomplete="off" placeholder="Enter to remember on this PC"></label></div><label class="check"><input id="allowHttp" type="checkbox">Allow HTTP for this Jellyfin server</label><p id="credentialHint" class="hint">On Windows, the API key is remembered on this PC until you remove it.</p><div class="actions"><button id="connect" class="primary" type="submit">Connect and save name</button><button id="removeCredential" type="button">Remove remembered key</button><span id="connectionStatus" class="hint">Not connected</span></div></form></section>
<section class="panel" aria-labelledby="runTitle"><h2 id="runTitle">Scanner</h2><p id="nodeStatus" class="hint">Start the scanner to link this node, then configure it in Intro Skipper → Nodes.</p><div class="actions"><button id="start" class="primary" type="button">Start scanner</button><button id="stop" type="button" disabled>Stop scanner</button></div><p id="message" role="status" aria-live="polite"></p></section>
</main><script nonce="__NONCE__">'use strict';const $=id=>document.getElementById(id);const session=location.hash.slice(1)||sessionStorage.getItem('scannerSession');if(location.hash){sessionStorage.setItem('scannerSession',session);history.replaceState(null,'',location.pathname)}let state,busy=false,connectionDirty=false;function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}async function api(path,body){const response=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'X-Scanner-Session':session||'',...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||(response.status===401?'Open the settings link printed by the scanner to start a new session.':'The settings request was rejected.'));return result}function render(view,fields=true){state=view;if(fields){connectionDirty=false;$('nodeName').value=view.name;$('serverUrl').value=view.serverUrl;$('allowHttp').checked=view.allowInsecureHttp;$('apiKey').placeholder=view.credentialAvailable?'Remembered or environment key available':view.credentialPersistenceSupported?'Enter to remember on this PC':'Enter for this session';$('credentialHint').textContent=view.credentialPersistenceSupported?'On Windows, the API key is remembered on this PC until you remove it. You can also use the key already set for the worker.':'This platform does not provide protected local key storage. Use the configured environment variable for worker and CLI credentials.'}$('connectionStatus').textContent=view.connected?'Connected':'Not connected';$('nodeStatus').textContent=view.nodeEnabled===true?'This scanner is enabled in IntroSkipper.':view.nodeEnabled===false?'Registered. Enable this scanner in IntroSkipper → Nodes.':'Start the scanner to link this node, then configure it in Intro Skipper → Nodes.';$('workerStatus').textContent=view.running?'Running':view.workerError?'Stopped · check message':'Stopped';for(const control of document.querySelectorAll('#connection input,#connection button'))control.disabled=view.running||busy;$('removeCredential').disabled=busy||!view.credentialAvailable;const canStart=view.canStart===true||(view.canStart===undefined&&view.nodeEnabled!==null&&view.configured);$('start').disabled=view.running||busy||!canStart||connectionDirty;$('stop').disabled=!view.running||busy;if(view.workerError)message(view.workerError,true)}async function act(action,success){busy=true;if(state)render(state,false);try{const view=await action();busy=false;render(view);message(success)}catch(error){busy=false;if(state)render(state,false);message(error.message,true)}}$('connection').addEventListener('submit',event=>{event.preventDefault();act(async()=>{const view=await api('connect',{name:$('nodeName').value.trim(),serverUrl:$('serverUrl').value.trim(),apiKey:$('apiKey').value||null,allowInsecureHttp:$('allowHttp').checked});$('apiKey').value='';return view},'Connection saved. Start the scanner to link it in Intro Skipper.')});$('connection').addEventListener('input',()=>{connectionDirty=true;if(state)render(state,false)});$('start').addEventListener('click',()=>act(()=>api('start',{}),'Scanner started. It waits for enabled-node jobs from Jellyfin.'));$('stop').addEventListener('click',()=>act(()=>api('stop',{}),'Scanner stopped. Accepted markers are preserved.'));$('removeCredential').addEventListener('click',()=>act(()=>api('remove-credential',{}),'Remembered key removed. The scanner stopped.'));api('settings').then(view=>render(view)).catch(error=>message(error.message,true));setInterval(async()=>{if(!busy&&state){try{render(await api('settings'),false)}catch(error){message(error.message,true)}}},5000);</script></body></html>
